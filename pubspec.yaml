name: neo_bank_mehr_iran
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_localization: ^0.3.3
  persian_flutter: ^0.2.0
  carousel_slider: ^5.1.1
  fluttertoast: ^8.2.12
  flutter_bloc: ^9.1.1
  go_router: ^16.1.0
  persian_number_utility: ^1.1.6
  flutter_credit_card: ^4.1.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.5
  flutter_svg: ^2.2.1
  fl_chart: ^1.1.1
  device_preview: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icon/
    - assets/image/
    - assets/image/Bank_Card/
    - assets/svg/
    - assets/icon/navigation_bar_icon/
    - assets/svg/fund_transfer_page/
    - assets/svg/bank_services_page/

  fonts:
    - family: IRANSans
      fonts:
        - asset: assets/fonts/IRANSansX-Regular.ttf

