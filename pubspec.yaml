name: neo_bank_mehr_iran
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter dependencies
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  dio: ^5.9.0
  equatable: ^2.0.7
  intl: ^0.20.2
  shared_preferences: ^2.5.2
  encrypted_shared_preferences: ^3.0.1
  flutter_native_contact_picker_plus: ^1.3.1
  http: ^1.6.0
  get_it: ^9.2.1
  injectable: ^3.0.0

  # UI / Widgets
  carousel_slider: ^5.1.1
  fluttertoast: ^9.1.0
  flutter_svg: ^2.2.1
  fl_chart: ^1.1.1
  shimmer_animation: ^2.2.2
  shimmer: ^3.0.0
  pinput: ^6.0.1

  # Device / Platform
  device_info_plus: ^13.1.0
  package_info_plus: ^10.1.0
  share_plus: ^13.1.0
  local_auth: ^3.0.1
  camera: ^0.12.0+1
  path_provider: ^2.1.5
  barcode_scan2: ^4.8.1
  device_preview: ^1.3.1


  # Date / Number
  persian_number_utility: ^1.1.6
  shamsi_date: ^1.1.1
  persian_datetime_picker: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.1.3
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo/
    - assets/icon/
    - assets/image/
    - assets/image/card_design/
    - assets/image/Bank_Card/
    - assets/svg/
    - assets/icon/navigation_bar_icon/
    - assets/svg/fund_transfer_page/
    - assets/svg/bank_services_page/

  fonts:
    - family: IRANSans
      fonts:
        - asset: assets/fonts/IRANSansX-Regular.ttf
